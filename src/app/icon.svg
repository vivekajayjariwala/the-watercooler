<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 514.952 514.952">
  <!--
    The droplet from public/water.svg, as the tab icon.

    The source file hardcodes black, which disappears against a dark tab strip.
    SVG favicons honour prefers-color-scheme, so the fills below track the
    app's own --foreground token in each theme instead.
  -->
  <style>
    path { fill: #0a0a0a; }
    @media (prefers-color-scheme: dark) {
      path { fill: #ededed; }
    }
  </style>
